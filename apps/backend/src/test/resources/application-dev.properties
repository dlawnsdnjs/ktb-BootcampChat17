# `make dev` uses spring-boot:test-run, so test resources shadow the main
# application.properties. Load local development storage settings explicitly
# for the dev profile without leaking a developer's .env into normal tests.
spring.config.import=optional:file:.env[.properties]

file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.storage.s3.bucket=${S3_BUCKET_NAME:}
file.storage.s3.region=${AWS_REGION:}
file.storage.s3.direct-upload-enabled=${S3_DIRECT_UPLOAD_ENABLED:false}
