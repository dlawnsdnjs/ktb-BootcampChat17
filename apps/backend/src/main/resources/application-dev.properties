# Local development starts Redis through Docker Compose, so use the same
# Socket.IO store implementation as production by default.
# Set SOCKETIO_STORE_TYPE=memory only for an intentional local fallback.
socketio.store.type=${SOCKETIO_STORE_TYPE:redis}
chat.store.type=${CHAT_STORE_TYPE:redis}
chat.read-cache.enabled=${CHAT_READ_CACHE_ENABLED:true}
rate-limit.store.type=${RATE_LIMIT_STORE_TYPE:redis}
recent-message-counter.store.type=${RECENT_MESSAGE_COUNTER_STORE_TYPE:redis}
